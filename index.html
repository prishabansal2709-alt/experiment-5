<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body class="bg-light">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4" style="width: 450px;">

            <h1 class="text-center text-primary mb-2">
                Weather App
            </h1>

            <p class="text-center text-muted mb-4">
                Check the weather in your city
            </p>

            <p class="text-center text-muted">
                JSS Mahavidyapeetha<br>
                JSS University, Noida<br>
                Department of Computer Science and Data Science
            </p>

            <div class="input-group mb-3">

                <input type="text" id="cityInput"
                    class="form-control"
                    placeholder="Enter city name">

                <button class="btn btn-primary" id="searchBtn">
                    Search
                </button>

            </div>

            <p id="message" class="text-danger text-center"></p>

            <div class="text-center mt-3">

                <h1 id="weatherIcon" class="display-3"></h1>

                <h1 id="temperature" class="fw-bold">--°C</h1>

                <h3 id="cityName">Enter a city</h3>

                <p id="condition" class="text-secondary">
                    Weather Condition
                </p>

            </div>

            <hr>

            <div class="row text-center mt-3">

                <div class="col-4">
                    <h3></h3>
                    <p class="mb-1">Humidity</p>
                    <h5 id="humidity">--%</h5>
                </div>

                <div class="col-4">
                    <h3></h3>
                    <p class="mb-1">Wind Speed</p>
                    <h5 id="wind">-- km/h</h5>
                </div>

                <div class="col-4">
                    <h3></h3>
                    <p class="mb-1">Feels Like</p>
                    <h5 id="feelsLike">--°C</h5>
                </div>

            </div>

            <div class="text-center mt-4">
                <small class="text-muted">
                    Weather data by Open-Meteo
                </small>
            </div>

        </div>

    </div>

</body>
</html>
